[project]
name = "smeta-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.18.3,<3.19",
  "dj-database-url>=2.3,<4",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["ruff>=0.14,<1", "pytest>=8.4,<10", "pytest-django>=4.11,<5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
