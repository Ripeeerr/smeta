services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_HOST: db
    command: ["uv", "run", "--frozen", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_HOST: db
    command: ["uv", "run", "--frozen", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      - api_venv:/app/.venv
      - attachments:/app/var
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - web_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  api_venv:
  web_modules:
  attachments:
